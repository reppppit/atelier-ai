
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171320">
<title>DIT AI - 나만의 AI 채팅 작업실</title>
<style>
:root {
  --bg: #111018;
  --panel: #1b1925;
  --line: #393346;
  --text: #f5f0ff;
  --muted: #b8afc9;
  --accent: #c6a7ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
.app {
  max-width: 800px;
  min-height: 100vh;
  margin: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
}
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.logo {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: var(--accent);
  color: #21182e;
  font-weight: bold;
}
h1 { font-size: 21px; margin: 0; }
.subtitle { color: var(--muted); font-size: 12px; margin-top: 4px; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
.settings {
  margin-left: auto;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--text);
  background: var(--panel);
}
main { flex: 1; }
.welcome {
  text-align: center;
  padding: 65px 10px 35px;
}
.welcome .star {
  color: var(--accent);
  font-size: 42px;
}
.welcome p { color: var(--muted); line-height: 1.7; }
#messages {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 20px 0;
}
.message {
  padding: 14px 16px;
  border-radius: 16px;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.user {
  background: #49366b;
  margin-left: 35px;
}
.ai {
  background: var(--panel);
  border: 1px solid var(--line);
  margin-right: 20px;
}
.composer {
  position: sticky;
  bottom: 0;
  padding: 12px 0;
  background: var(--bg);
}
form {
  display: flex;
  gap: 8px;
  align-items: center;
}
textarea {
  flex: 1;
  resize: vertical;
  min-width: 0;
  min-height: 48px;
  max-height: 150px;
  padding: 13px;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 15px;
}
.send {
  min-width: 50px;
  height: 48px;
  border: 0;
  border-radius: 14px;
  background: var(--accent);
  color: #21182e;
  font-size: 22px;
  font-weight: bold;
}
.note {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  margin-top: 10px;
}
dialog {
  width: 90%;
  max-width: 480px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 18px;
}
dialog::backdrop { background: #000a; }
dialog input {
  width: 100%;
  margin: 8px 0 14px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--text);
}
.save {
  background: var(--accent);
  color: #21182e;
  padding: 11px 16px;
  border: 0;
  border-radius: 10px;
}
.clear {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">DIT</div>
    <div>
      <h1>DIT AI</h1>
      <div class="subtitle">나만의 AI 채팅 작업실</div>
    </div>
    <button class="settings" onclick="openSettings()">
      ⚙ 설정
    </button>
  </header>

  <main>
    <section class="welcome" id="welcome">
      <div class="star">✦</div>
      <h2>무엇이든 물어보세요.</h2>
      <p>
        공부, 글쓰기, 아이디어 정리까지.<br>
        DIT AI와 대화를 시작해 보세요.
      </p>
    </section>

    <section id="messages"></section>

    <div class="composer">
      <form id="chatForm">
        <textarea id="prompt"
          placeholder="DIT AI에게 메시지 보내기..."
          required></textarea>
        <button class="send" type="submit">↑</button>
      </form>
      <div class="note" id="status">
        AI 연결을 설정하면 채팅을 사용할 수 있어요.
      </div>
      <div style="text-align:center;margin-top:12px">
        <button class="clear" onclick="clearChat()">
          대화 지우기
        </button>
      </div>
    </div>
  </main>
</div>

<dialog id="settingsDialog">
  <h2>DIT AI 연결 설정</h2>
  <p>보안 프록시 주소와 모델 ID를 입력하세요.</p>

  <form id="settingsForm" style="display:block">
    <label for="proxy">보안 프록시 주소</label>
    <input id="proxy" type="url"
      placeholder="https://내-worker주소.workers.dev"
      required>

    <label for="model">모델 ID</label>
    <input id="model" type="text"
      placeholder="사용 가능한 모델 ID"
      required>

    <p class="note">
      API 키는 이 페이지에 입력하지 마세요.
      서버의 Secret 설정을 사용해야 합니다.
    </p>

    <button class="save" type="submit">설정 저장</button>
    <button class="clear" type="button"
      onclick="document.getElementById('settingsDialog').close()">
      취소
    </button>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);

let config = {
  proxy: localStorage.getItem("dit_proxy") || "",
  model: localStorage.getItem("dit_model") || ""
};

let history = [];
let busy = false;

function openSettings() {
  $("proxy").value = config.proxy;
  $("model").value = config.model;
  $("settingsDialog").showModal();
}

$("settingsForm").addEventListener("submit", event => {
  event.preventDefault();

  config.proxy = $("proxy").value.trim();
  config.model = $("model").value.trim();

  localStorage.setItem("dit_proxy", config.proxy);
  localStorage.setItem("dit_model", config.model);

  $("settingsDialog").close();
  $("status").textContent = "설정을 저장했어요.";
});

function addMessage(role, text) {
  $("welcome").style.display = "none";

  const item = document.createElement("div");
  item.className = "message " + role;
  item.textContent = text;

  $("messages").appendChild(item);
  item.scrollIntoView({ behavior: "smooth" });

  return item;
}

$("chatForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (busy) return;

  const text = $("prompt").value.trim();
  if (!text) return;

  if (!config.proxy || !config.model) {
    openSettings();
    $("status").textContent =
      "먼저 보안 프록시 주소와 모델 ID를 설정하세요.";
    return;
  }

  busy = true;
  $("prompt").value = "";
  $("status").textContent = "AI가 답변을 작성하고 있어요.";

  addMessage("user", text);
  history.push({ role: "user", content: text });

  const reply = addMessage("ai", "답변을 기다리는 중...");

  try {
    const response = await fetch(config.proxy, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: config.model,
        messages: history,
        stream: false
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data?.error?.message || "HTTP " + response.status
      );
    }

    const answer =
      data?.choices?.[0]?.message?.content;

    if (typeof answer !== "string" || !answer) {
      throw new Error("AI 답변을 읽을 수 없습니다.");
    }

    reply.textContent = answer;
    history.push({ role: "assistant", content: answer });
    $("status").textContent = "답변 완료";
  } catch (error) {
    reply.textContent =
      "연결에 실패했어요.\n" +
      (error.message || "알 수 없는 오류") +
      "\n프록시 주소와 모델 설정을 확인해 주세요.";

    $("status").textContent = "연결 실패";
    history.pop();
  } finally {
    busy = false;
  }
});

function clearChat() {
  history = [];
  $("messages").replaceChildren();
  $("welcome").style.display = "";
  $("status").textContent = "새 대화를 시작하세요.";
}
</script>
</body>
</html>
